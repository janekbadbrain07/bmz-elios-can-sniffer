# =============================================================
# BMZ Elios CAN Sniffer dla ESPHome
# Autor: badbrain07
# Licencja: PolyForm Noncommercial 1.0.0 (patrz plik LICENSE)
# =============================================================
# =============================================================
# CHANGELOG
# v1.2 (2026-09-17) — Fix: sensory "Aktywność Rozbieżność" wisiały
#                      na stanie "nieznany" w HA, jeśli od startu
#                      nigdy nie doszło do realnej rozbieżności
#                      (publish_state() wołany tylko przy zmianie).
#                      Dodana jednorazowa publikacja stanu "off"
#                      przy starcie.
# v1.1 (2026-09-17) — Histereza + debounce dla sensorów aktywności
#                      falownika (0,08A ON / 0,03A OFF, 8s zwłoki),
#                      dodany sensor rozbieżności 1C0 vs 38X (30s).
#                      Dodany sensor wersji firmware (fw_version).
# v1.0 (bazowa)      — Pierwsza wersja.
# =============================================================

esphome:
  name: bmz-elios-can
  friendly_name: BMZ_Elios_CAN
  project:
    name: "badbrain07.bmz_elios_can"
    version: "1.2"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "Bmz-Elios-Can Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Warsaw"
    servers:
      - 0.pl.pool.ntp.org
      - 1.pl.pool.ntp.org

# =============================================================
# GLOBALS — ring buffer na ramki CAN
# =============================================================
globals:
  - id: g_queue
    type: uint8_t[1664]
    restore_value: no
  - id: g_queue_head
    type: int
    initial_value: '0'
    restore_value: no
  - id: g_queue_tail
    type: int
    initial_value: '0'
    restore_value: no

  # Heartbeat — ostatnia wartość licznika B6 dla każdego modułu
  # Aktualizowany przez ramki: 0x10X, 0x14X, 0x18X, 0x1CX, 0x38X, 0x3CX
  - id: g_hb_last
    type: uint8_t[4]
    restore_value: no
  - id: g_hb_time
    type: uint32_t[4]
    restore_value: no

# =============================================================
# SENSORY ANALOGOWE (NAPIĘCIA, PRĄDY, TEMP, SOC)
# =============================================================
sensor:

  # -----------------------------------------------------------
  # ENCJE ZBIORCZE (SYSTEMOWE)
  # -----------------------------------------------------------
  - platform: template
    name: "System SOC"
    id: sys_soc
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement

  - platform: template
    name: "System Moc Całkowita"
    id: sys_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 2
      - or:
          - delta: 5.0
          - throttle: 10s

  - platform: template
    name: "System Prąd Całkowity"
    id: sys_current
    unit_of_measurement: "A"
    accuracy_decimals: 1
    device_class: current
    state_class: measurement

  - platform: template
    name: "System Napięcie Średnie"
    id: sys_voltage
